services:
  qdrant:
    image: qdrant/qdrant:v1.12.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - edge_data:/app/edge_data
    depends_on:
      - qdrant

  dashboard:
    build: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  edge_data:
